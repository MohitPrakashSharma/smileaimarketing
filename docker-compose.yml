version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smileai-postgres
    environment:
      POSTGRES_USER: smileai
      POSTGRES_PASSWORD: smileai_password
      POSTGRES_DB: smileai_marketing
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: smileai-redis
    ports:
      - "6375:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
